<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <linearGradient id="meshGradient" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#00D4FF" />

      <stop offset="100%" stop-color="#0052FF" />

    </linearGradient>

  </defs>

  

  <!-- Background -->

  <rect width="512" height="512" rx="110" fill="#0A2540"/>

  

  <!-- Mesh Lines -->

  <path d="M160 360 L256 160 L352 360 Z" stroke="url(#meshGradient)" stroke-width="32" stroke-linejoin="round" fill="none"/>

  <path d="M160 360 L256 280 L352 360" stroke="url(#meshGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M256 160 L256 280" stroke="url(#meshGradient)" stroke-width="32" stroke-linecap="round"/>

  

  <!-- Network Nodes -->

  <circle cx="160" cy="360" r="36" fill="#00D4FF"/>

  <circle cx="352" cy="360" r="36" fill="#0052FF"/>

  <circle cx="256" cy="160" r="36" fill="#00D4FF"/>

  <circle cx="256" cy="280" r="36" fill="#0052FF"/>

</svg> 

